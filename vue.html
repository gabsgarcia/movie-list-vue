<!DOCTYPE html>
<html>
  <head>
    <title>Movie List · Vue</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      [v-cloak] { display: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Movie List · Vue</h1>

      <!-- O Vue "manda" nesta div (mount). v-cloak esconde até ele carregar -->
      <div id="app" class="row" v-cloak>
        <p v-if="movies.length === 0">Loading...</p>

        <!-- v-for repete esta div para cada filme (como o {{#movies}} do Mustache) -->
        <div v-for="movie in movies" class="col-3">
          <div class="card mb-3">
            <!-- atributo: usa : (v-bind), não {{ }} -->
            <img :src="movie.Poster" class="card-img-top" :alt="movie.Title + ' poster'">
            <div class="card-body">
              <!-- texto: usa {{ }} -->
              <h2 class="card-title">{{ movie.Title }}</h2>
              <p class="card-text">{{ movie.Year }}</p>
              <a :href="'https://www.imdb.com/title/' + movie.imdbID" class="btn btn-primary" target="_blank">Go on IMDB</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="javascript/vue.js" type="module"></script>
  </body>
</html>
